name: Health Self-Ping

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          if [ -n "${{ secrets.SERVER_BASE_URL }}" ]; then
            curl -f "${{ secrets.SERVER_BASE_URL }}/health"
          else
            echo "SERVER_BASE_URL secret not set. Skipping ping."
          fi
