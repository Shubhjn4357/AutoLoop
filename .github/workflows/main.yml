name: AutoLoop CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_quality:
        description: 'Skip quality, build and test jobs'
        required: false
        default: true
        type: boolean

jobs:
  quality:
    if: github.event.inputs.skip_quality != 'true'
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: "libsql://dummy.turso.io"
      TURSO_AUTH_TOKEN: "dummy"
      AUTH_SECRET: "dummy"
      SERVER_API_KEY: "dummy"
      FACEBOOK_CLIENT_ID: "dummy"
      FACEBOOK_CLIENT_SECRET: "dummy"
      META_VERIFY_TOKEN: "dummy"
      META_APP_SECRET: "dummy"
      AUTOMATION_CRON_SECRET: "dummy"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Doctor
        run: pnpm doctor:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Security Audit
        run: pnpm audit --audit-level=high

  build:
    if: github.event.inputs.skip_quality != 'true'
    name: Build & Size
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Build-time env vars (dummy values for CI if needed)
          TURSO_DATABASE_URL: "libsql://dummy.turso.io"
          TURSO_AUTH_TOKEN: "dummy"
          AUTH_SECRET: "dummy"
          SERVER_API_KEY: "dummy"

      - name: Check Worker Size
        run: |
          # OpenNext puts the worker in .open-next/worker.js or functions directory
          # We check the 3MB Cloudflare limit
          if [ -d ".open-next" ]; then
            find .open-next -name "*.js" -exec ls -lh {} +
            WORKER_SIZE=$(du -b .open-next/worker.js | cut -f1 || echo 0)
            echo "Worker size: $WORKER_SIZE bytes"
            if [ $WORKER_SIZE -gt 3145728 ]; then
              echo "CRITICAL: Worker size exceeds 3MB limit!"
              exit 1
            fi
          fi

  test:
    if: github.event.inputs.skip_quality != 'true'
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: "libsql://dummy.turso.io"
      TURSO_AUTH_TOKEN: "dummy"
      AUTH_SECRET: "dummy"
      SERVER_API_KEY: "dummy"
      PORT: 7860
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Component tests
        run: pnpm test:components

      - name: Install Playwright Browsers
        run: |
          pnpm --filter @autoloop/server exec playwright install chromium
          pnpm --filter @autoloop/server exec playwright install-deps chromium
        timeout-minutes: 10

      - name: Automation tests
        run: pnpm test:e2e

  deploy:
    name: Deploy & Sync
    needs: [quality, build, test]
    if: always() && github.ref == 'refs/heads/main' && (github.event.inputs.skip_quality == 'true' || (needs.quality.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "shubhamjain.com.in@gmail.com"
          git config --global user.name "shubhjn"
          
          # Clean up any potential node_modules that might have been checked out
          find . -name "node_modules" -type d -exec rm -rf {} +
          
          # Create a fresh deployment repository to avoid history issues
          mkdir -p deploy_tmp/apps
          cp -r apps/server deploy_tmp/apps/
          cp -r packages deploy_tmp/
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml Dockerfile README.md .gitattributes deploy_tmp/
          
          cd deploy_tmp
          git init
          git config user.email "shubhamjain.com.in@gmail.com"
          git config user.name "shubhjn"
          
          # Ensure we don't accidentally include anything else
          git add .
          git commit -m "Deploy AutoLoop Server to Hugging Face"
          
          git remote add hf https://shubhjn:$HF_TOKEN@huggingface.co/spaces/shubhjn/autoloop
          git push --force hf master:main
