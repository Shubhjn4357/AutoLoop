name: Automation Queue Processor

on:
  schedule:
    # Run every minute for near-real-time processing
    - cron: "*/1 * * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  process-queue:
    name: Process Event Queue & Follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Process Queue Events & Scheduled Messages
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 2 --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            ${{ secrets.APP_URL }}/api/automation/followups)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Queue processing returned HTTP $STATUS"
          fi
      - name: Log completion
        run: echo "Queue processing completed at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
